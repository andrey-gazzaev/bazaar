services:
  postgres:
    image: postgres:16-alpine
    container_name: bazaar-postgres
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
      POSTGRES_DB: bazaar
    ports:
      - "54329:5432"
    volumes:
      - bazaar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d bazaar"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: bazaar-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: bazaar-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  bazaar-pg:
